[package]
name = "steam-assets"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
i-slint-compiler = "=1.18.1"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = "2"
tempfile = "3"
unicode-script = "0.5"
